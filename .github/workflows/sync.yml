name: Sync to website3
on:
  push:
    branches: [main]
    paths:
      - '**.png'
      - '**.PNG'
      - '**.jpg'
      - '**.JPG'
      - '**.jpeg'
      - '**.JPEG'
      - '**.webp'
      - '**.WEBP'
      - '**.avif'
      - '**.AVIF'
      - '**.tif'
      - '**.TIF'
      - '**.tiff'
      - '**.TIFF'
      - '**/meta.json'
      - 'config.json'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Override the deletion guard and regenerate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: originals
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aintkaran/website3
          ssh-key: ${{ secrets.WEBSITE3_DEPLOY_KEY }}
          path: website
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: originals/package-lock.json
      - name: Install
        working-directory: originals
        run: npm ci
      - name: Test
        working-directory: originals
        run: npm test
      - name: Sync
        working-directory: originals
        run: node scripts/sync.mjs --target ../website
      - name: Commit and push
        working-directory: website
        run: |
          git config user.name "aintkaran"
          git config user.email "157907182+aintkaran@users.noreply.github.com"
          git add -A public/assets/projects .sync
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          {
            echo "Sync from originals $(git -C ../originals rev-parse --short HEAD)"
            echo
            git diff --cached --name-status | awk '{print $1" "$2}' | grep -v manifest.json | head -80
          } > ../commit-msg.txt
          git commit -F ../commit-msg.txt
          git pull --rebase origin main
          git push origin HEAD:main
